<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bill Splitter — Razorpay</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root{color-scheme:light;--bg:#f6f5f2;--card:#fff;--ink:#1c1b19;--sub:#6b6862;--accent:#b5482a;--line:#e5e2dc;--paid:#3f7d4f}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:680px;margin:auto;padding:24px 16px 48px}h1{font-size:1.5rem;margin:0 0 4px}.muted,.hint{color:var(--sub);font-size:.88rem}.card,.qr-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}label{display:block;font-size:.75rem;font-weight:700;color:var(--sub);text-transform:uppercase;margin:0 0 5px}input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:12px}.row{display:flex;gap:12px}.row>*{flex:1}.participant{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:end}.participant label{font-size:.7rem}.participant input{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.55;cursor:wait}.summary{display:flex;justify-content:space-between;padding:4px 0}.qr-grid{display:grid;gap:12px}.qr-card{text-align:center}.qr-card.paid{border-color:var(--paid)}.qr{background:#fff;display:inline-block;padding:8px;border-radius:8px;margin:10px}.pill{display:inline-block;border-radius:99px;padding:3px 10px;background:var(--line);color:var(--sub);font-size:.75rem;font-weight:700}.pill.paid{background:var(--paid);color:#fff}.error{color:#a22}.small{font-size:.78rem;color:var(--sub);word-break:break-all}
  </style>
</head>
<body><main class="wrap">
  <h1>Bill Splitter</h1><p class="muted">Create a secure Razorpay payment link for each participant. Payment status is verified by the backend webhook.</p>
  <section class="card">
    <label for="apiBase">Backend API URL</label><input id="apiBase" placeholder="https://your-worker.workers.dev" autocomplete="url">
    <div class="row"><div><label for="total">Total bill (₹)</label><input id="total" type="number" min="0" step="0.01" placeholder="3000"></div><div><label for="count">Participants</label><input id="count" type="number" min="1" value="3"></div></div>
    <label for="splitMode">Split mode</label><select id="splitMode"><option value="equal">Equal split</option><option value="custom">Custom amounts</option></select>
    <p id="hint" class="hint"></p><div id="participants"></div>
    <div class="actions"><button id="generate">Generate payment links</button><button id="reset" class="secondary" type="button">Reset</button></div><p id="message" class="hint"></p>
  </section>
  <section class="card"><div class="summary"><span>Total</span><strong id="sumTotal">₹0.00</strong></div><div class="summary"><span>Paid</span><strong id="sumPaid">₹0.00</strong></div><div class="summary"><span>Pending</span><strong id="sumPending">₹0.00</strong></div></section>
  <section id="results" class="qr-grid"></section>
</main>
<script>
  // Set this once after deploying the Worker, or leave blank and enter it in the form.
  const DEFAULT_API_BASE = '';
  let people = [], timers = [];
  const $ = id => document.getElementById(id);
  const money = n => `₹${Number(n || 0).toFixed(2)}`;
  function resizePeople(){ const n=Math.max(1,parseInt($('count').value,10)||1); while(people.length<n) people.push({name:`Person ${people.length+1}`,amount:0,status:'pending'}); people.length=n; distribute(); renderPeople(); updateSummary(); }
  function distribute(){ const total=Number($('total').value)||0; if($('splitMode').value!=='equal') return; const cents=Math.round(total*100), base=Math.floor(cents/(people.length||1)); people.forEach((p,i)=>p.amount=(i===people.length-1?cents-base*(people.length-1):base)/100); $('hint').textContent=total?`${money(total/(people.length||1))} each (last person receives rounding).`:''; }
  function renderPeople(){ $('participants').innerHTML=people.map((p,i)=>`<div class="participant"><div><label>Name</label><input data-name="${i}" value="${escapeHtml(p.name)}"></div><div><label>Amount (₹)</label><input data-amount="${i}" type="number" min="0" step="0.01" value="${p.amount.toFixed(2)}" ${$('splitMode').value==='equal'?'readonly':''}></div></div>`).join(''); document.querySelectorAll('[data-name]').forEach(e=>e.oninput=()=>people[e.dataset.name].name=e.value||`Person ${+e.dataset.name+1}`); document.querySelectorAll('[data-amount]').forEach(e=>e.oninput=()=>{people[e.dataset.amount].amount=Number(e.value)||0;updateSummary()}); }
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function updateSummary(){const total=people.reduce((s,p)=>s+Number(p.amount||0),0),paid=people.filter(p=>p.status==='paid').reduce((s,p)=>s+Number(p.amount||0),0);$('sumTotal').textContent=money(total);$('sumPaid').textContent=money(paid);$('sumPending').textContent=money(total-paid)}
  function base(){return ($('apiBase').value.trim()||DEFAULT_API_BASE).replace(/\/$/,'')}
  async function generate(){ if(!base()){show('Enter your deployed backend URL first.',true);return} const total=people.reduce((s,p)=>s+Number(p.amount||0),0); if(!total||people.some(p=>p.amount<=0)){show('Enter a positive amount for every participant.',true);return} if($('splitMode').value==='custom'&&Math.abs(total-(Number($('total').value)||0))>.01){show('Custom amounts must equal the total bill.',true);return} $('generate').disabled=true;show('Creating payment links…'); $('results').innerHTML=''; try{for(const p of people){const r=await fetch(base()+'/create-payment-link',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({amount:p.amount,name:p.name,description:'Bill split payment'})});if(!r.ok)throw new Error((await r.json()).error||'Payment link creation failed');const d=await r.json();p.linkId=d.linkId;p.url=d.shortUrl;p.status='pending';} renderResults();show('Links created. Keep this page open to receive automatic status updates.')}catch(e){show(e.message,true)}finally{$('generate').disabled=false}}
  function renderResults(){ $('results').innerHTML=people.map((p,i)=>`<article class="qr-card ${p.status==='paid'?'paid':''}"><strong>${escapeHtml(p.name)} — ${money(p.amount)}</strong><div class="qr" id="qr-${i}"></div><div><span class="pill ${p.status==='paid'?'paid':''}">${p.status==='paid'?'Paid':'Pending'}</span></div><p class="small">${escapeHtml(p.url||'')}</p><div class="actions" style="justify-content:center"><button class="secondary" data-open="${i}" type="button">Open payment</button><button class="secondary" data-manual="${i}" type="button">${p.status==='paid'?'Undo':'Manual mark paid'}</button></div></article>`).join('');people.forEach((p,i)=>{if(p.url)new QRCode($(`qr-${i}`),{text:p.url,width:180,height:180,correctLevel:QRCode.CorrectLevel.M})});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>window.open(people[b.dataset.open].url,'_blank','noopener'));document.querySelectorAll('[data-manual]').forEach(b=>b.onclick=()=>{people[b.dataset.manual].status=people[b.dataset.manual].status==='paid'?'pending':'paid';renderResults();updateSummary()});updateSummary(); people.forEach((p,i)=>{if(p.linkId&&p.status!=='paid'){clearInterval(timers[i]);timers[i]=setInterval(()=>poll(i),5000)}})}
  async function poll(i){const p=people[i];if(!p.linkId||p.status==='paid')return;try{const r=await fetch(base()+'/status/'+encodeURIComponent(p.linkId));if(r.ok){const d=await r.json();if(d.status==='paid'){p.status='paid';renderResults()}}}catch(e){console.warn('Status polling failed',e)}}
  function show(t,error=false){$('message').textContent=t;$('message').className=error?'hint error':'hint'}
  $('count').oninput=resizePeople;$('total').oninput=()=>{distribute();renderPeople();updateSummary()};$('splitMode').onchange=()=>{distribute();renderPeople();updateSummary()};$('generate').onclick=generate;$('reset').onclick=()=>{timers.forEach(clearInterval);people=[];$('results').innerHTML='';$('total').value='';$('count').value=3;resizePeople();show('')};$('apiBase').value=DEFAULT_API_BASE;resizePeople();
</script></body></html>
